[project]
name = "workforce"
version = "0.1.0"
description = "AI employees in Slack: Dispatcher, policy engine, memory, agent-harness loop"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "claude-agent-sdk>=0.2.161",
  "pyspellchecker>=0.8",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["workforce"]
