# Permissions — enforced by the Dispatcher Tool Proxy.
# Rule: deny by default. An action is allowed only if
#   (1) the tool is in the employee's `tools` allowlist (org.yaml), AND
#   (2) the action's tier <= employee.max_tier, AND
#   (3) the tier's approval rule is satisfied, AND
#   (4) budgets (per task AND per employee per day) are not exceeded, AND
#   (5) no pause/kill switch is active for the employee, dept, or globally, AND
#   (6) for R2/R3: a stored approval exists bound to the exact action hash (tool + params).
# Tools are custom tools executed by the Dispatcher; agents have no built-in toolset
# and no credentials (see DESIGN-MAP §4).

version: 0.2

# Who may start or steer tasks. Anyone else: polite refusal + owner ping.
requesters:
  owner: ["U_OWNER"]
  owner_only: true          # DECIDED: only the owner gives tasks, in every channel
  by_department:            # kept empty while owner_only is true
    hq: []
    studio: []
    sales: []
    office: []
    engineering: []
    ops: []
  deny: [guests, slack_connect_external, bots, apps, unknown]


tiers:
  R0:
    meaning: read / reason / internal draft in task workspace
    approval: none
    audit: summary
  R1:
    meaning: internal reversible write
    approval: none
    audit: full
  R2:
    meaning: external-facing or bulk
    approval: dept_manager_or_owner_or_backup   # or away-mode delegate
    preview_required: true
    audit: full
  R3:
    meaning: irreversible, money, legal, people decisions, deletes
    approval: owner_only          # away-mode delegate only for approval_policy.away_mode.delegate_gets_R3_only_for
    preview_required: true
    double_confirm: true        # "Approve" then "Confirm" button
    audit: full
  R4:
    meaning: forbidden
    approval: never
    on_attempt: [deny, alert_owner, log_violation, pause_employee_after: 3]

approval_policy:
  silence_means: no
  reminders_after_hours: [4, 24]
  park_task_after_hours: 72
  channels: [task_thread, "#approvals"]
  approvers:
    owner: ["U_OWNER"]                 # fill Slack user id
    backup: []                         # DECIDED: not needed — you approve from Slack or the Live Office
    dept_managers:                     # optional; empty => owner (then backup)
      studio: []
      sales: []
      office: []
      engineering: []
      ops: []
  approval_scope: single_action        # bound to action hash; never carries over or replays
  cross_department:
    inherit_parent_G1_if_max_tier_in: [R0, R1]
    approver_of_record: parent_requester

bulk_thresholds:                        # crossing ANY window bumps the action to R2
  per_task:
    files_created: 25
    slack_messages_posted: 30
  per_employee_per_day:                 # closes the "split across tasks" loophole
    files_created: 60
    slack_messages_posted: 80
    emails_sent_external: 20

spend_caps_usd_per_employee_per_day:    # 80% → alert; ≥100% → each further paid call is R2; ≥150% → employee auto-paused
  default: 5
  show_sherlock_builder: 25             # render + voice on the runtime
  show_jai_builder: 25
  show_striker_builder: 25

egress:
  # Employees holding NO private-data tools may fetch any public URL (R0) — they have nothing private to leak,
  # and the checks below still run. Holders of private-data tools never get web.fetch (validator enforces),
  # except the Verifier, which may only re-fetch exact URLs already present in the task's fetch log.
  web_fetch_allowlist: []               # optional extra trust list; not required for research
  verifier_fetch: exact_urls_in_task_fetch_log_only
  block_if:
    query_string_chars_over: 200
    url_contains_private_task_data: true
    ip_literal_or_localhost: true
  private_data_holders_no_fetch: true   # employees with crm/ats/email read tools get web.search only
  third_party_generation_pii_filter: true


kill_switches:
  global: "/pause-all"                  # owner only; halts tool execution + new sessions ≤5s
  scoped: "/pause <employee|dept>"
  resume: "/resume <all|employee|dept>" # owner only
  auto_pause:
    r4_attempts: 3
    spend_pct_of_daily_cap: 150
    error_rate_pct_over_15_min: 30



routines:
  max_tier: R1
  output: own_channel_only
  requested_by: "routine:<name>"


# Action catalog. Tool names are namespaced connector.action.
actions:
  # --- generic ---
  web.search: R0
  web.fetch: R0
  workspace.read: R0
  workspace.write: R0          # task workspace (L4) only
  memory.read_scoped: R0
  memory.submit_candidate: R0
  slack.post_own_thread: R1
  slack.post_own_channel: R1
  slack.post_other_channel: R4
  slack.dm_external: R4

  # --- docs / files ---
  drive.read: R0
  drive.create_draft: R1

  # --- design / media ---
  image.edit: R1
  video.edit: R0
  video.render: R1             # spend cap
  brandkit.read: R0
  brandkit.write: R4           # owner edits brand kit in git

  # --- email ---
  email.read: R0
  email.draft: R1
  email.send_external: R2





  # --- owner's private files (uploaded by the owner; holders never get the web) ---
  owner_profile.read: R0       # CV, portfolio, work history (shows up in applications)
  finance.read_uploads: R0     # bank/card statements, invoices you upload

  # --- your pitch/application pipeline (contacts = private data) ---
  pipeline.read: R0
  pipeline.update: R1          # status/notes/follow-up date only; rows are created by code when something is sent

  # --- applications / invoicing ---
  apply.submit: R2             # submit a job application (exact preview, you click)
  social.post: R2              # post a reel/post to a channel (exact preview, you click); no connector -> outbox
  invoice.send: R2             # send an invoice to a client (exact preview, you click)

  # --- code ---
  code.read: R0
  code.write: R1               # task workspace / sandbox checkout only
  code.push: R2                # push a branch / open a PR (needs a GitHub connector)
  deploy.vercel: R2            # preview or production deploy on your Vercel Hobby account

  # --- ops / automation ---
  automation.create_draft: R1
  automation.activate: R2
  payments.any: R3             # no employee holds it: any money action is irreversible (approve + confirm)

  # --- orchestration (internal, handled by Dispatcher) ---
  delegate: R0                 # lead -> own specialist only (edge check)
  submit_contract: R0          # lead/CoS -> Dispatcher: task contract draft (G1)
  submit_plan: R0              # lead -> Dispatcher: handoff packets = harness plan
  submit_delivery: R0          # lead -> Dispatcher: assembled deliverable (G4)
  submit_return: R0            # specialist -> Dispatcher: return packet
  submit_verdict: R0           # verifier -> Dispatcher: criterion grades
  submit_factcheck: R0         # fact checker -> Dispatcher: claim-by-claim TRUE/FALSE/UNSOURCED
  request_verification: R0
  escalate: R0
  cos.request: R0              # lead -> chief of staff
  request_department: R0       # chief of staff -> any lead
  task.list: R0
  task.status: R0
  media.inspect: R0            # read dims/duration/colors of an artifact
  voice.synthesize: R1         # voice service (engine per show skill: Chatterbox clone / Kokoro base); consented voices only; spend cap
  sandbox.exec: R1             # runs an allowlisted skill's scripts/CLI in an isolated per-task container (no creds, no private data); spend cap applies

  # --- librarian service account only ---
  memory.read_all_meta: R0
  memory.write_shared_service: R1
  memory.archive: R1
  slack.post_agent_log: R1

  # --- system (always forbidden to agents) ---
  config.modify: R4
  permissions.modify: R4
  prompt.modify: R4
  agent.create: R4
  memory.write_shared: R4      # only Librarian service account, via its own path
  memory.read_other_private: R4
  credentials.read: R4
  approval.bypass: R4
  agent_toolset.any: R4        # built-in bash/file/web tools never enabled
  kill_switch.toggle: R4       # humans only


# Actions grantable ONLY to the listed kind (validator enforces; anyone else holding them = config error):
restricted_to_kind:
  librarian: [memory.write_shared_service, memory.archive, memory.read_all_meta, slack.post_agent_log]
  router: [request_department, task.list, task.status]
  lead: [delegate, cos.request, submit_plan, submit_delivery]
  specialist: [submit_return]
  verifier: [submit_verdict]
  fact_checker: [submit_factcheck]

budgets_default:
  monthly_llm_budget: plan_agent_sdk_credit   # Pro $20 / Max5x $100 / Max20x $200; hard stop when used
  monthly_llm_budget_usd: 20                  # owner's plan: Pro. All work pauses at 100% until next month
  cost_usd_per_task: {S: 0.5, M: 2, L: 6}
  tool_calls_per_specialist_per_task: 60
  revision_loops: 2
  parallel_specialists: 4
  concurrent_tasks_per_lead: 5
  concurrent_tasks_per_show: 2          # I6: one show can't take every Studio/Sales slot
  no_progress_ping_min: 30
  no_progress_escalate_min: 120
  alert_spend_pct_of_daily_budget: 80
  alert_approval_queue_over: 10

# Enforced in code, not configured here: untrusted content is always wrapped (prompts.untrusted); external
# actions run once per approval hash (ActionRun); approval buttons carry the hash and are checked (on_approval);
# bots, edits and app messages are ignored (slack.py); specialists can't message each other (no such tool).
