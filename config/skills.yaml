# Skill map v0.4 — deterministic skill routing, smallest possible context per employee.
#
# HOW A SKILL GETS FIRED (no guessing by the model):
#  1. Lead writes the handoff packet with a `task_type` from this file's route list for that specialist.
#     The Dispatcher rejects a packet whose task_type isn't listed.
#  2. Only that route's `run` skills are loaded into the new session. `skill#slice` loads ONLY
#     .claude/skills/<skill>/slices/<slice>.md — the one part of a show pipeline this employee owns
#     (writer / designer / builder), never the whole pipeline.
#  3. `support` skills are NOT loaded. The employee may read one of them (or one reference file of a loaded
#     skill) on demand with the skill_read tool — progressive disclosure keeps every session small.
#  4. `adapt:` on a route overrides a skill's global adapter for that route only (adapters never leak to the
#     other employees that load the same skill).
#  5. No matching route → no skill; employee works from craft + constitution, or escalates if the Lead
#     marked the task `skill_required`.
#  6. Each route's `checks` (config/checks.yaml) become the agent-harness verification for that plan task.
#  7. `upstream_from`: the plan must feed this route an output made by one of these employees. `owner` = your own
#     words or an upload (upload:<scope>/<file>) — e.g. the scripts you write for Jai and football.
#
# Owner edits this file. Employees never self-install/update skills. `scripts/validate_config.py` checks:
# skills/slices exist, no conflicting pair loads together, every sub-skill a skill calls is available.

version: 0.4

skill_runtime:
  sandbox_tool: sandbox.exec     # scripts/CLIs run in an isolated per-task container (no creds, no private data)
  self_update: forbidden         # "npx hyperframes skills update" etc. → owner does it in git
  provider_credentials: "none — the runtime holds no keys; Kokoro voices and renders run on your Modal runtime; no image generation"
  voice_policy:
    per_show: {sherlock: "Kokoro bm_lewis (base, British)", jai: "you record the voiceover yourself", football: "you record the voiceover yourself"}
    forbidden: [cloning any voice, real people or characters' voices]
  telemetry: off   # hyperframes / media-use analytics (PostHog) disabled — no task data leaves via telemetry
  skill_read_max_chars: 40000

# Global overrides for steps inside a skill that clash with our rules. Role-specific overrides go on the route (`adapt:`).
adapters:
  hyperframes:        {strip: [hyperframes publish, skills update, "workflow routing (the workflow skills are not installed — the storyboard is the plan)", "intent interview (existing project)"], publish_via: "none - render to workspace only"}
  hyperframes-cli:    {strip: [publish, cloud, lambda, cloudrun, tts, auth], note: "render locally in the sandbox only; Sherlock's voice comes from voice_line", allow: [lint, check, preview, snapshot, render, transcribe, remove-background]}
  media-use:          {voice: "never — Sherlock uses voice_line; Jai and football use your recorded voiceover", image_generation: disabled, sourcing: "never download media — every asset comes from the owner"}
  research:           {output: "task workspace (not repo files)"}
  handoff:            {output: "only the handoff packet's context_summary field (schemas/handoff_packet.json)"}
  to-tickets:         {tracker: "tickets as JSON in the task workspace (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  to-spec:            {tracker: "drive.create_draft (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  to-questionnaire:   {output: "only the contract's `questions` field (the owner answers in the Slack thread)"}
  ui-styling:         {note: "implements the existing design; never picks its own palette/type"}
  write-a-skill:      {output: "the new SKILL.md goes INSIDE the employee spec file (new_skills:), never into .claude/skills"}

# Skills that overlap or fight. Never loaded in the same route unless `order` says how they stack.
conflicts:
  - group: [ui-ux-pro-max, hyperframes-creative]
    order: [ui-ux-pro-max, hyperframes-creative]
    resolution: 'ui-ux-pro-max designs (palette, type); hyperframes-creative only narration, beat planning, composition patterns'
  - group: [ui-ux-pro-max, ui-styling]
    order: [ui-ux-pro-max, ui-styling]
    resolution: 'ui-ux-pro-max sets the design system; ui-styling only implements it in code'
  - group: [handoff, to-questionnaire]
    resolution: 'to specialists = handoff (packet summary); to you, when blocked on a decision = to-questionnaire'

# Phase skills: loaded into a Lead's / router's own phases (they never run routes — they plan and delegate).
phase_skills:
  lead:   {contract: [to-questionnaire], plan: [handoff]}
  router: {contract: [to-questionnaire]}

hyperframes_support: &hf_support [hyperframes, hyperframes-cli, hyperframes-animation, hyperframes-keyframes, hyperframes-audio, hyperframes-registry, hyperframes-studio, media-use]
design_support: &design_support [components, ui-ux-pro-max, hyperframes-animation, hyperframes-registry, hyperframes-creative]

# Route fields: task_type is unique ORG-WIDE (one owner per kind of work, I2).
employees:

  # ---------------- head office
  chief_of_staff: {routes: []}                  # Atlas — phase skill to-questionnaire
  verifier: {routes: []}                        # Vera — grades every task against your original request
  fact_checker: {routes: []}                    # Proof — claim checking, no skill
  librarian: {routes: []}                       # Lex — code path (memory GC + bloat report)
  architect:                                    # Mason — writes a PROPOSAL, never live config
    routes:
      - {task_type: design_employee, output: "one YAML employee spec — FIRST output", run: [writing-for-agents], checks: [employee_spec]}
    support: [write-a-skill, "*"]               # "*" = may list the installed skill library (names + descriptions)

  # ---------------- studio: designer → builder per show, then the poster
  studio_lead: {routes: []}                     # Maya
  show_sherlock_designer:                       # Sherlock-Design
    routes:
      - {task_type: sherlock_storyboard, output: "storyboard.json — FIRST output", upstream_from: [show_sherlock_writer], run: ["sherlock#design"], checks: [storyboard_spec]}
    support: *design_support
  show_sherlock_builder:                        # Sherlock-Build
    routes:
      - {task_type: sherlock_build, output: "the rendered MP4 — FIRST output", requires: render, upstream_from: [show_sherlock_designer], run: ["sherlock#build", hyperframes-core], checks: [hyperframes_check, video_spec]}
    support: *hf_support
  show_jai_designer:                            # Jai-Design
    routes:
      - {task_type: jai_storyboard, output: "storyboard.json — FIRST output", upstream_from: [owner], run: ["jai#design"], checks: [storyboard_spec]}
    support: *design_support
  show_jai_builder:                             # Jai-Build
    routes:
      - {task_type: jai_build, output: "the rendered MP4 — FIRST output", requires: render, upstream_from: [show_jai_designer], run: ["jai#build", hyperframes-core], checks: [hyperframes_check, video_spec]}
    support: *hf_support
  show_football_designer:                       # Football-Design
    routes:
      - {task_type: football_storyboard, output: "storyboard.json — FIRST output", upstream_from: [owner], run: ["football-video#design"], checks: [storyboard_spec]}
    support: [football-video, components, ui-ux-pro-max, hyperframes-animation, hyperframes-registry, hyperframes-creative]
  show_football_builder:                        # Football-Build
    routes:
      - {task_type: football_build, output: "the rendered MP4 — FIRST output", requires: render, upstream_from: [show_football_designer], run: ["football-video#build", hyperframes-core], checks: [hyperframes_check, video_spec]}
    support: [football-video, hyperframes, hyperframes-cli, hyperframes-animation, hyperframes-keyframes, hyperframes-audio, hyperframes-registry, hyperframes-studio, media-use]
  studio_poster:                                # Post
    routes:
      - {task_type: instagram_post, output: "post.json — FIRST output", upstream_from: [show_sherlock_builder, show_jai_builder, show_football_builder], run: [instagram-post], checks: [post_ready]}

  # ---------------- sales: your words, your ideas, your jobs
  sales_lead: {routes: []}                      # Sam
  sales_writer:                                 # Echo — your writing style lives in context/sales_writer.md
    routes:
      - {task_type: pitch_email,  run: [], checks: [spellcheck, no_ai_tells, char_limits]}
      - {task_type: dm,           run: [], checks: [spellcheck, no_ai_tells, char_limits]}
      - {task_type: follow_up,    run: [], checks: [spellcheck, no_ai_tells, char_limits]}
      - {task_type: reel_caption, output: "caption.md — FIRST output", upstream_from: [owner], run: [], scope: "Jai and football captions only, in your voice; English only", checks: [spellcheck, no_ai_tells, char_limits]}
    support: [humanizer]
  sales_ideas:                                  # Burrow — trained on your taste in context/sales_ideas.md
    routes:
      - {task_type: find_ideas, run: [research], scope: "find and PICK ideas only — never write the script", checks: [citations_resolve, link_check]}
  show_sherlock_writer:                         # Sherlock-Writer (research + script + caption)
    routes:
      - {task_type: sherlock_script, output: "script.json — FIRST output; caption.md second", run: ["sherlock#write"], checks: [spellcheck, no_ai_tells, citations_resolve]}
    support: [research, humanizer]
  sales_cover_letter_writer:                    # Letter
    routes:
      - {task_type: cover_letter, upstream_from: [sales_job_finder, owner], pii_allowed: true, run: [], scope: "keep the rawness — remove AI tells only, never polish the passion out", checks: [spellcheck, no_ai_tells, citations_resolve]}
    support: [humanizer]
  sales_job_finder:                             # Scout
    routes:
      - {task_type: find_jobs, run: [research], checks: [citations_resolve, link_check]}

  # ---------------- engineering: one lane per project
  eng_lead: {routes: []}                        # Forge
  eng_office_backend:                           # Byte — this office's Python backend
    routes:
      - {task_type: office_backend_build,   requires: sandbox, run: [implement, tdd], checks: [sandbox_tests]}
      - {task_type: office_backend_fix,     requires: sandbox, run: [diagnosing-bugs, tdd], checks: [sandbox_tests]}
      - {task_type: office_backend_spec,    run: [to-spec], checks: [spellcheck]}
      - {task_type: office_backend_tickets, output: "tickets as JSON — FIRST output", run: [to-tickets], checks: [json_valid]}
    support: [strict-api, resolving-merge-conflicts, codebase-design, git-guardrails-claude-code, setup-pre-commit]
  eng_office_frontend:                          # Loom — the Live Office frontend
    routes:
      - {task_type: office_ui_build,      requires: sandbox, run: [components, vercel-react-best-practices], checks: [sandbox_tests]}
      - {task_type: office_ui_fix,        requires: sandbox, run: [diagnosing-bugs], checks: [sandbox_tests]}
      - {task_type: office_deploy_preview, requires: sandbox, run: [deploy-to-vercel], checks: [sandbox_tests]}
    support: [ui-ux-pro-max, ui-styling, vercel-composition-patterns, strict-api]
  eng_company:                                  # Byte-Co — company lane only
    routes:
      - {task_type: company_implement,    requires: sandbox, run: [implement, tdd], checks: [sandbox_tests]}
      - {task_type: company_fix_bug,      requires: sandbox, run: [diagnosing-bugs, tdd], checks: [sandbox_tests]}
      - {task_type: company_write_spec,   run: [to-spec], checks: [spellcheck]}
      - {task_type: company_tickets, output: "tickets as JSON — FIRST output", run: [to-tickets], checks: [json_valid]}
      - {task_type: power_automate_flow, output: "Power Automate / Logic Apps definition JSON ({\"definition\": {triggers, actions}}) — FIRST output", run: [], scope: "Power Automate only", checks: [power_automate_only]}
    support: [strict-api, resolving-merge-conflicts, git-guardrails-claude-code]

  # ---------------- ops: money + your inbox
  ops_lead: {routes: []}                        # Otto
  ops_bookkeeper:                               # Ledger
    routes:
      - {task_type: bookkeeping,  run: [], checks: [citations_resolve]}
      - {task_type: invoice,      pii_allowed: true, run: [], checks: [spellcheck, citations_resolve]}
      - {task_type: money_report, run: [], checks: [spellcheck, citations_resolve]}
  ops_inbox_scanner:                            # Scan (daily 9am routine)
    routes:
      - {task_type: inbox_digest, pii_allowed: true, run: [], checks: [inbox_coverage]}

# agent-harness is NOT an employee skill: it's the Dispatcher's task loop engine (config/harness.yaml).
system_engine: [agent-harness]

unassigned:
  builder_only:            # the owner runs this once so to-spec / to-tickets know your tracker
    - setup-matt-pocock-skills
