# Skill map v0.2 — deterministic skill routing.
#
# HOW A SKILL GETS FIRED (no guessing by the model):
#  1. Lead writes the handoff packet with a `task_type` (+ optional `style_tags`) taken from this file's
#     route list for that specialist. The Dispatcher rejects a packet whose task_type isn't listed.
#  2. Dispatcher looks up employees.<id>.routes → the route with that task_type (exact match, one route).
#  3. Only that route's skills are loaded into the new session, in `run` order (+ `modifiers` whose
#     condition matches style_tags). Nothing else in the allowlist is loaded.
#  4. A loaded skill may call its own sub-skills only if they're listed in the employee's `support`.
#  5. No matching route → no skill; employee works from craft + constitution, or escalates if the Lead
#     marked the task `skill_required`.
#  6. Skills used are logged and shown on your G4 card.
#  7. Each route's `checks` (config/checks.yaml) become the agent-harness verification for that plan task;
#     the harness controller runs them itself — the employee never marks its own work verified.
#
# Owner edits this file. Employees never self-install/update skills. `scripts/validate_config.py` checks:
# skills exist, no conflicting pair loads together, every sub-skill a skill calls is available or stripped.

version: 0.2

skill_runtime:
  sandbox_tool: sandbox.exec     # scripts/CLIs run in an isolated per-task container (no creds, no private data)
  self_update: forbidden         # "npx hyperframes skills update" etc. → owner does it in git
  routers_forbidden: [ask-matt, maps-skill, find-skills]
  provider_credentials:
    # Skills call paid APIs (media-use, hyperframes tts/render, product-launch-video, ui-ux-pro-max fonts).
    # The sandbox never holds keys: its egress proxy injects the key for allowlisted provider hosts,
    # per employee, and meters spend against the daily cap.
    mode: egress_proxy_injection
    per_employee:
      mkt_video_editor:     [hyperframes_heygen]
      mkt_personal_reels:   [hyperframes_heygen]
    providers:
      hyperframes_heygen: "DECIDED: HeyGen for rendering only (its TTS is not used)"
      voice: "DECIDED: OpenVoice V2 self-hosted on Modal, via Dispatcher tool voice.synthesize (no API key in sandbox)"
      image: "DECIDED: none for now — logo_or_image route disabled"
  voice_policy:
    allowed_reference_voices: [owner]          # only voices with recorded consent
    per_show: {jai: "owner voice clone (OpenVoice)", sherlock: "OpenVoice/MeloTTS base speaker (no cloning)", company_videos: "OpenVoice/MeloTTS base speaker (no cloning)", peter: "NO VOICE — captions only (Peter Griffin voice dropped: no consent)"}
    requires_consent_record: true              # shows/<show>/voice/reference/CONSENT.md
    forbidden: [real people or characters without consent (e.g. celebrity or cartoon voice actors)]
  telemetry: off   # hyperframes / media-use analytics (PostHog) disabled — no task data leaves via telemetry

# Per-skill overrides: steps inside a skill that clash with our rules are disabled or rerouted.
adapters:
  hyperframes:        {missing_workflows: [motion-graphics, pr-to-video], strip: [hyperframes publish, skills update, "workflow routing (product-launch-video / faceless-explainer / music-to-video / general-video)"], note: "workflow is pre-selected by task_type; hyperframes only does project setup/state + capability routing", publish_via: "none - render to workspace only"}
  hyperframes-cli:    {strip: [publish, lambda, cloudrun, tts, auth], note: "cloud render = HeyGen (allowed); tts disabled — voice comes from voice.synthesize", allow: [lint, check, preview, snapshot, render, tts, transcribe, remove-background]}
  jai:                {voice: "OpenVoice (replaces Chatterbox)", strip: ["superpowers:brainstorming", publish, "/hallmark pass (deleted - humanizer does the text pass)", "/artsy-components effects (deleted)"], replace_with: "handoff packet + open_questions to Lead", posting: "owner posts manually"}
  football-video:     {strip: [publish, post it], output: "video + caption draft"}
  sherlock:           {strip: [publish, post it, "implicit trigger \"asks for a new AI reel\""], trigger: "only when owner explicitly says sherlock", scope: "AI topics only", output: "video + caption draft"}
  peter:              {strip: [publish, "Peter Griffin voice / any voiceover"], output: "captions-only video + caption draft"}
  slides:             {strip: ["own design tokens / palette choice"], note: "design system comes from ui-ux-pro-max (loaded first)"}
  hyperframes-creative: {strip: ["palette / typography / brand decisions"], note: "design system comes from ui-ux-pro-max (loaded first)"}
  general-video:      {note: "references motion-graphics (not installed) — short unnarrated motion pieces also go to general-video"}
  make-scenario-building: {missing_companion: "make-module-configuring (HOW to configure modules) not installed — Gear designs scenario structure only; module config is a GAP"}
  media-use:          {voice: "voice.synthesize (OpenVoice) instead of ElevenLabs/HeyGen TTS", image_generation: "disabled until an image provider is chosen"}
  research:           {output: "task workspace (not repo files)"}
  handoff:            {output: "only the handoff packet's context_summary field (schemas/handoff_packet.json)"}
  to-tickets:         {tracker: "pm.create_task (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  to-spec:            {tracker: "drive.create_draft (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  wayfinder:          {tracker: "pm.create_task (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  faceless-explainer: {note: "may suggest product-launch-video when input is a URL - Lead must re-route via task_type instead"}

# STATUS: all resolutions below DECIDED by owner (2026-09-29).
# Skills that overlap or fight. Never loaded in the same route unless `order` says how they stack.
conflicts:
  - group: [ui-ux-pro-max, media-use]
    order: [ui-ux-pro-max, media-use]
    why: 'media-use can pick looks/colour grades too'
    resolution: 'DECIDED: ui-ux-pro-max sets style; media-use only generates/resolves the asset'
  - group: [ui-ux-pro-max, slides]
    order: [ui-ux-pro-max, slides]   # ui-ux-pro-max sets the design system, slides builds the deck
    why: 'DECIDED: ui-ux-pro-max is the only design-system skill (hallmark deleted)'
    resolution: 'DECIDED: every visual = ui-ux-pro-max (design, design-system, banner-design, artsy-components, excalidraw-diagram, hallmark deleted)'
  - group: [ui-ux-pro-max, hyperframes-creative]
    order: [ui-ux-pro-max, hyperframes-creative]
    why: 'hyperframes-creative also sets palette/typography/brand'
    resolution: 'DECIDED: ui-ux-pro-max designs (design system, palette, type); hyperframes-creative only narration, beat planning, composition patterns; HyperFrames builds'
  - group: [hyperframes]
    why: 'DECIDED: all videos use HyperFrames (remotion-best-practices deleted)'
    resolution: 'DECIDED: every video = hyperframes (+ its sub-skills)'
  - group: [product-launch-video, faceless-explainer, music-to-video, general-video]
    why: 'alternative video workflows'
    resolution: 'DECIDED: keep all 4, exactly one per task, chosen by input — product URL/brief=product-launch-video, text with no footage=faceless-explainer, music track=music-to-video, anything else=general-video'
  - group: [football-video]
    why: 'DECIDED: popeye deleted'
    resolution: 'DECIDED: all football videos = football-video'
  - group: [jai, sherlock]
    why: 'both make topic reels'
    resolution: 'DECIDED: jai = general videos; sherlock = AI videos only, and only when you explicitly say sherlock'
  - group: [web-quality-audit, seo, core-web-vitals]
    why: 'web-quality-audit already covers SEO, performance, a11y, best practices'
    resolution: 'DECIDED: full audit=web-quality-audit; SEO content/on-page only=seo; speed metrics only=core-web-vitals (accessibility, performance deleted)'
  - group: [humanizer]
    why: 'DECIDED: humanizer is the only text rewriter (brand and linkedin-marketing deleted)'
    resolution: 'DECIDED: every text rewrite = humanizer'
  - group: [to-tickets, agile-product-owner, wayfinder, to-spec]
    why: 'all break down/plan work'
    resolution: 'DECIDED (as mapped): decisions still open=wayfinder; agreed discussion → document=to-spec; known plan → tickets=to-tickets; sprints/story points/velocity only=agile-product-owner'
  - group: [writing-for-agents, teach]
    why: 'teach is interactive tutoring of you, not document writing'
    resolution: 'DECIDED (as mapped): writing-for-agents for SOPs; teach stays unassigned'
  - group: [handoff, to-questionnaire]
    why: 'both compress context for someone else'
    resolution: 'DECIDED (as mapped): to specialists=handoff (packet summary); to you, when blocked on a decision=to-questionnaire'

employees:

  # ---------------- core
  chief_of_staff:                               # Atlas
    routes:
      - {task_type: clarify_with_owner, run: [to-questionnaire], checks: [spellcheck]}
      - {task_type: split_cross_dept,   run: [handoff], checks: [json_valid]}

  verifier:                                     # Vera
    routes:
      - {task_type: verify_web_page, run: [web-quality-audit], checks: [web_audit_scores]}
      # everything else: contract checks only, no skill

  librarian: {routes: []}                       # Lex

  # ---------------- marketing
  mkt_lead:                                     # Maya
    routes:
      - {task_type: clarify_with_owner,   run: [to-questionnaire], checks: [spellcheck]}
      - {task_type: brief_specialists,    run: [handoff], checks: [json_valid]}
      - {task_type: campaign_deck,        run: [ui-ux-pro-max, slides], checks: [spellcheck, citations_resolve]}

  mkt_graphic_designer:                         # Pixel
    routes:
      - {task_type: visual_design, run: [ui-ux-pro-max], checks: [image_spec, spellcheck, brand_colors]}   # banners, social graphics, UI, mockups, design systems
      - {task_type: logo_or_image, disabled: "no image provider chosen", run: [ui-ux-pro-max, media-use], checks: [image_spec, brand_colors]}     # ui-ux-pro-max sets style, media-use generates the image
      - {task_type: diagram,       run: [ui-ux-pro-max], checks: [image_spec, spellcheck]}                   # also serves Ops SOP diagrams via Chief of Staff

  mkt_video_editor:                             # Reel — company videos
    routes:
      - {task_type: launch_promo_video,   run: [ui-ux-pro-max, hyperframes, product-launch-video], checks: [hyperframes_check, video_spec, spellcheck, citations_resolve]}
      - {task_type: explainer_video,      run: [ui-ux-pro-max, hyperframes, faceless-explainer], checks: [hyperframes_check, video_spec, spellcheck, citations_resolve]}
      - {task_type: music_video,          run: [ui-ux-pro-max, hyperframes, music-to-video], checks: [hyperframes_check, video_spec]}
      - {task_type: other_video,          run: [ui-ux-pro-max, hyperframes, general-video], checks: [hyperframes_check, video_spec, spellcheck]}
    support: [hyperframes-core, hyperframes-creative, hyperframes-animation, hyperframes-keyframes, hyperframes-audio, hyperframes-registry, hyperframes-studio, hyperframes-cli, media-use]

  mkt_personal_reels:                           # Frame — your personal Instagram pipelines
    routes:
      - {task_type: jai_reel,       trigger_word: jai,      scope: general_topics, run: [jai], checks: [hyperframes_check, video_spec, no_ai_tells]}
      - {task_type: sherlock_reel,  trigger_word: sherlock, explicit_only: true, scope: ai_topics_only, run: [sherlock], checks: [hyperframes_check, video_spec]}
      - {task_type: football_reel,  trigger_word: football, run: [football-video], checks: [hyperframes_check, video_spec, citations_resolve]}
      - {task_type: brainrot_reel,  trigger_word: peter,    run: [peter], checks: [hyperframes_check, video_spec]}
    support: [hyperframes, hyperframes-core, hyperframes-creative, hyperframes-animation, hyperframes-keyframes, hyperframes-audio, hyperframes-registry, hyperframes-studio, hyperframes-cli, media-use, humanizer, ui-ux-pro-max]

  mkt_copywriter:                               # Quill
    routes:
      - {task_type: general_copy,   run: [humanizer], checks: [spellcheck, no_ai_tells, citations_resolve]}              # brand skipped until brand kit exists

  mkt_seo_content:                              # Sage
    routes:
      - {task_type: seo_brief,      run: [seo], checks: [citations_resolve]}
      - {task_type: blog_post,      run: [research, seo, humanizer], checks: [spellcheck, no_ai_tells, citations_resolve, link_check]}
      - {task_type: site_audit,     run: [web-quality-audit], checks: [web_audit_scores]}
      - {task_type: page_speed,     run: [core-web-vitals], checks: [web_audit_scores]}

  mkt_social_manager:                           # Echo
