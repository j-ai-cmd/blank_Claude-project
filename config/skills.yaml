    routes:
      - {task_type: sherlock_visual, requires: render, run: [sherlock, ui-ux-pro-max], scope: "design-pass step of /sherlock only (its locked style)", checks: [image_spec, spellcheck]}
  show_peter_producer:                          # Peter
    routes:
