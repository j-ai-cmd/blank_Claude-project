  chief_of_staff:                               # Atlas
    routes:
      - {task_type: clarify_with_owner, run: [to-questionnaire], checks: [spellcheck]}
      - {task_type: split_cross_dept,   run: [handoff], checks: [json_valid]}

  verifier:                                     # Vera
    routes:
      - {task_type: verify_web_page, run: [web-quality-audit], checks: [web_audit_scores]}
      - {task_type: verify_brand,    run: [brand], requires: brand_kit, checks: [brand_colors]}   # inactive until brand kit added
      # everything else: contract checks only, no skill

  librarian: {routes: []}                       # Lex

  # ---------------- marketing
  mkt_lead:                                     # Maya
    routes:
      - {task_type: clarify_with_owner,   run: [to-questionnaire], checks: [spellcheck]}
      - {task_type: brief_specialists,    run: [handoff], checks: [json_valid]}
      - {task_type: campaign_deck,        run: [slides], checks: [spellcheck, citations_resolve]}
      - {task_type: pre_delivery_review,  run: [brand], requires: brand_kit, checks: [brand_colors]}

  mkt_graphic_designer:                         # Pixel
    routes:
      - {task_type: banner_or_ad,         run: [banner-design], also: [brand], checks: [image_spec, spellcheck, brand_colors]}
      - {task_type: logo_icon_identity,   run: [design], also: [brand], checks: [image_spec]}
      - {task_type: social_graphic,       run: [design], also: [brand], checks: [image_spec, spellcheck, brand_colors]}
      - {task_type: textured_poster,      run: [artsy-components], also: [brand], checks: [image_spec, spellcheck]}
      - {task_type: landing_page_visual,  run: [hallmark], checks: [image_spec]}
      - {task_type: app_ui_mockup,        run: [ui-ux-pro-max], checks: [image_spec]}
      - {task_type: design_tokens,        run: [design-system], checks: [json_valid]}
      - {task_type: diagram,              run: [excalidraw-diagram], checks: [json_valid]}
    modifiers:
      artsy-components: {if_style_tags_any: [texture, grain, handmade, risograph, halftone, poster], applies_to: [banner_or_ad, social_graphic]}
    support: [ui-ux-pro-max]                    # design calls it internally

  mkt_video_editor:                             # Reel — company videos
    routes:
      - {task_type: launch_promo_video,   run: [hyperframes, product-launch-video], checks: [hyperframes_check, video_spec, spellcheck, citations_resolve]}
      - {task_type: explainer_video,      run: [hyperframes, faceless-explainer], checks: [hyperframes_check, video_spec, spellcheck, citations_resolve]}
      - {task_type: music_video,          run: [hyperframes, music-to-video], checks: [hyperframes_check, video_spec]}
      - {task_type: other_video,          run: [hyperframes, general-video], checks: [hyperframes_check, video_spec, spellcheck]}
    support: [hyperframes-core, hyperframes-creative, hyperframes-animation, hyperframes-keyframes, hyperframes-audio, hyperframes-registry, hyperframes-studio, hyperframes-cli, media-use]

  mkt_personal_reels:                           # Frame — your personal Instagram pipelines
    routes:
      - {task_type: jai_reel,       trigger_word: jai,      run: [jai], checks: [hyperframes_check, video_spec, no_ai_tells]}
      - {task_type: sherlock_reel,  trigger_word: sherlock, run: [sherlock], checks: [hyperframes_check, video_spec]}
      - {task_type: popeye_reel,    trigger_word: popeye,   run: [popeye], checks: [hyperframes_check, video_spec, citations_resolve]}
      - {task_type: football_reel,  trigger_word: football, run: [football-video], checks: [hyperframes_check, video_spec, citations_resolve]}
      - {task_type: brainrot_reel,  trigger_word: peter,    run: [peter], checks: [hyperframes_check, video_spec]}
    support: [hyperframes, hyperframes-core, hyperframes-creative, hyperframes-animation, hyperframes-keyframes, hyperframes-audio, hyperframes-registry, hyperframes-studio, hyperframes-cli, media-use, humanizer, ui-ux-pro-max, hallmark, artsy-components]

  mkt_copywriter:                               # Quill
    routes:
      - {task_type: general_copy,   run: [brand, humanizer], checks: [spellcheck, no_ai_tells, citations_resolve]}              # brand skipped until brand kit exists
      - {task_type: linkedin_copy,  run: [brand, linkedin-marketing, humanizer], checks: [spellcheck, no_ai_tells, char_limits, citations_resolve]}

  mkt_seo_content:                              # Sage
    routes:
      - {task_type: seo_brief,      run: [seo], checks: [citations_resolve]}
      - {task_type: blog_post,      run: [research, seo, humanizer], checks: [spellcheck, no_ai_tells, citations_resolve, link_check]}
      - {task_type: site_audit,     run: [web-quality-audit], checks: [web_audit_scores]}
      - {task_type: page_speed,     run: [core-web-vitals], checks: [web_audit_scores]}

  mkt_social_manager:                           # Echo
    routes:
      - {task_type: linkedin_post,       run: [linkedin-marketing, humanizer], checks: [spellcheck, no_ai_tells, char_limits]}
      - {task_type: other_platform_post, run: [humanizer], checks: [spellcheck, no_ai_tells, char_limits]}

  mkt_analyst: {routes: []}                     # Metric — GAP

  # ---------------- sales
  sales_lead:                                   # Sam
    routes:
      - {task_type: clarify_with_owner, run: [to-questionnaire], checks: [spellcheck]}
      - {task_type: brief_specialists,  run: [handoff], checks: [json_valid]}
  sales_prospector: {routes: []}                # Scout — GAP
  sales_researcher:                             # Intel
    routes:
      - {task_type: account_brief,    run: [research], checks: [citations_resolve, link_check]}
      - {task_type: competitor_brief, run: [research], checks: [citations_resolve, link_check]}
  sales_outreach_writer:                        # Hook
    routes:
