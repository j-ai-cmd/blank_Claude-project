  sales_crm_keeper: {routes: []}                # Ledger — GAP
  sales_proposal_writer:                        # Pitch
    routes:
      - {task_type: proposal_deck, run: [slides, humanizer], checks: [spellcheck, citations_resolve]}
      - {task_type: proposal_doc,  run: [humanizer], checks: [spellcheck, no_ai_tells, citations_resolve]}

  # ---------------- recruiting
  rec_lead:                                     # Rhea
    routes:
      - {task_type: clarify_with_owner, run: [to-questionnaire], checks: [spellcheck]}
      - {task_type: brief_specialists,  run: [handoff], checks: [json_valid]}
  rec_jd_writer:                                # Scribe
    routes:
      - {task_type: jd_or_scorecard, run: [humanizer], checks: [spellcheck, no_ai_tells]}
  rec_sourcer: {routes: []}                     # Radar — GAP
  rec_screener: {routes: []}                    # Lens — GAP
  rec_scheduler: {routes: []}                   # Slot — GAP
  rec_candidate_comms:                          # Herald
    routes:
      - {task_type: candidate_message, run: [humanizer], checks: [spellcheck, no_ai_tells, char_limits]}

  # ---------------- ops
  ops_lead:                                     # Otto
    routes:
      - {task_type: clarify_with_owner, run: [to-questionnaire], checks: [spellcheck]}
      - {task_type: brief_specialists,  run: [handoff], checks: [json_valid]}
