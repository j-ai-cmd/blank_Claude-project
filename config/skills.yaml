    routes:
      - {task_type: brainrot_visual, requires: render, run: [peter, ui-ux-pro-max], scope: "caption-style / design step of /peter only", checks: [image_spec, spellcheck]}
  show_striker_producer:                        # Striker
    routes:
      - {task_type: football_reel, requires: render, upstream_from: [show_striker_writer], run: [football-video], scope: "asset request (incl. your recorded voiceover), build, check, render steps of /football-video (the script arrives approved)", checks: [hyperframes_check, video_spec]}
    support: *show_video_support
