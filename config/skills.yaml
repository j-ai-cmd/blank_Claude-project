# Skill map v0.2 — deterministic skill routing.
#
# HOW A SKILL GETS FIRED (no guessing by the model):
#  1. Lead writes the handoff packet with a `task_type` (+ optional `style_tags`) taken from this file's
#     route list for that specialist. The Dispatcher rejects a packet whose task_type isn't listed.
#  2. Dispatcher looks up employees.<id>.routes → the route with that task_type (exact match, one route).
#  3. Only that route's skills are loaded into the new session, in `run` order (+ `modifiers` whose
#     condition matches style_tags). Nothing else in the allowlist is loaded.
#  4. A loaded skill may call its own sub-skills only if they're listed in the employee's `support`.
#  5. No matching route → no skill; employee works from craft + constitution, or escalates if the Lead
#     marked the task `skill_required`.
#  6. Skills used are logged and shown on your G4 card.
#  7. Each route's `checks` (config/checks.yaml) become the agent-harness verification for that plan task;
#     the harness controller runs them itself — the employee never marks its own work verified.
#
# Owner edits this file. Employees never self-install/update skills. `scripts/validate_config.py` checks:
# skills exist, no conflicting pair loads together, every sub-skill a skill calls is available or stripped.

version: 0.2

skill_runtime:
  sandbox_tool: sandbox.exec     # scripts/CLIs run in an isolated per-task container (no creds, no private data)
  self_update: forbidden         # "npx hyperframes skills update" etc. → owner does it in git
  routers_forbidden: [ask-matt, maps-skill, find-skills]

# Per-skill overrides: steps inside a skill that clash with our rules are disabled or rerouted.
adapters:
  linkedin-marketing: {strip: [publora_publish], publish_via: "social.publish (R2 approval)"}
  hyperframes:        {strip: [hyperframes publish, skills update, "workflow routing (product-launch-video / faceless-explainer / music-to-video / general-video)"], note: "workflow is pre-selected by task_type; hyperframes only does project setup/state + capability routing", publish_via: "none - render to workspace only"}
  hyperframes-cli:    {strip: [publish, cloud, lambda, cloudrun, auth], allow: [lint, check, preview, snapshot, render, tts, transcribe, remove-background]}
  jai:                {strip: ["superpowers:brainstorming", publish], replace_with: "handoff packet + open_questions to Lead", posting: "owner posts manually"}
  artsy-components:   {strip: ["superpowers:brainstorming"], replace_with: "handoff packet + open_questions to Lead"}
  football-video:     {strip: [publish, post it], output: "video + caption draft"}
  popeye:             {strip: [publish, post it], output: "video + caption draft"}
  sherlock:           {strip: [publish, post it], output: "video + caption draft"}
  peter:              {strip: [publish], output: "video + caption draft"}
  research:           {output: "task workspace (not repo files)"}
  handoff:            {output: "only the handoff packet's context_summary field (schemas/handoff_packet.json)"}
  to-tickets:         {tracker: "pm.create_task (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  to-spec:            {tracker: "drive.create_draft (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  wayfinder:          {tracker: "pm.create_task (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  design-system:      {strip: [slide generation], note: "slides belong to the slides skill"}
  design:             {strip: [html presentations, banner design, design tokens], note: "owned by slides / banner-design / design-system"}
  faceless-explainer: {note: "may suggest product-launch-video when input is a URL - Lead must re-route via task_type instead"}

# STATUS: every conflict resolution below is PROPOSED — pending owner decision (asked one by one).
# Skills that overlap or fight. Never loaded in the same route unless `order` says how they stack.
conflicts:
  - group: [design, banner-design, design-system, slides]
    why: 'design bundles banners, tokens and presentations that the others also do'
    resolution: 'one owner per job — banners=banner-design, tokens=design-system, decks=slides, logo/icon/identity/social-photo=design (adapters strip the duplicate modules)'
  - group: [hallmark, ui-ux-pro-max]
    why: 'two page/UI design systems with different aesthetics'
    resolution: 'landing/marketing pages=hallmark; app/product screens and mockups=ui-ux-pro-max; exception — personal-reel pipelines call ui-ux-pro-max (design pass) and jai also hallmark (words), allowed only inside those pipelines'
  - group: [hyperframes, remotion-best-practices]
    why: 'competing video frameworks'
    resolution: 'HyperFrames only; remotion-best-practices parked'
  - group: [product-launch-video, faceless-explainer, music-to-video, general-video]
    why: 'alternative video workflows'
    resolution: 'exactly one per task, chosen by input — product URL/brief=product-launch-video, text with no footage=faceless-explainer, music track=music-to-video, anything else=general-video'
  - group: [popeye, football-video]
    why: 'both make football reels'
    resolution: 'you say "popeye" → popeye; any other football reel → football-video'
  - group: [jai, sherlock]
    why: 'both make general-topic reels'
    resolution: '"jai" → your own voice/@jaidhingra_; "sherlock" → sherlock_teaches_ai persona'
  - group: [web-quality-audit, seo, core-web-vitals, accessibility, performance]
    why: 'web-quality-audit already covers SEO, performance, a11y, best practices'
    resolution: 'full audit=web-quality-audit; SEO content/on-page only=seo; speed metrics only=core-web-vitals; accessibility and performance parked'
  - group: [humanizer, linkedin-marketing, brand]
    why: 'all three rewrite tone (AI-tell removal, LinkedIn heuristics, brand voice)'
    order: [brand, linkedin-marketing, humanizer]   # brand sets voice → LinkedIn shapes format → humanizer final pass, must keep brand voice
  - group: [to-tickets, agile-product-owner, wayfinder, to-spec]
    why: 'all break down/plan work'
    resolution: 'decisions still open=wayfinder; agreed discussion → document=to-spec; known plan → tickets=to-tickets; sprints/story points/velocity only=agile-product-owner'
  - group: [writing-for-agents, teach]
    why: 'teach is interactive tutoring of you, not document writing'
    resolution: 'writing-for-agents for SOPs; teach parked (owner-only)'
  - group: [handoff, to-questionnaire]
    why: 'both compress context for someone else'
    resolution: 'to specialists=handoff (packet summary); to you, when blocked on a decision=to-questionnaire'

employees:

