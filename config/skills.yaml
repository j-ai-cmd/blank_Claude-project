# Skill map v0.2 — deterministic skill routing.
#
# HOW A SKILL GETS FIRED (no guessing by the model):
#  1. Lead writes the handoff packet with a `task_type` (+ optional `style_tags`) taken from this file's
#     route list for that specialist. The Dispatcher rejects a packet whose task_type isn't listed.
#  2. Dispatcher looks up employees.<id>.routes → the route with that task_type (exact match, one route).
#  3. Only that route's skills are loaded into the new session, in `run` order (+ `modifiers` whose
#     condition matches style_tags). Nothing else in the allowlist is loaded.
#  4. A loaded skill may call its own sub-skills only if they're listed in the employee's `support`.
#  5. No matching route → no skill; employee works from craft + constitution, or escalates if the Lead
#     marked the task `skill_required`.
#  6. Skills used are logged and shown on your G4 card.
#  7. Each route's `checks` (config/checks.yaml) become the agent-harness verification for that plan task;
#     the harness controller runs them itself — the employee never marks its own work verified.
#
# Owner edits this file. Employees never self-install/update skills. `scripts/validate_config.py` checks:
# skills exist, no conflicting pair loads together, every sub-skill a skill calls is available or stripped.

version: 0.3

skill_runtime:
  sandbox_tool: sandbox.exec     # scripts/CLIs run in an isolated per-task container (no creds, no private data)
  self_update: forbidden         # "npx hyperframes skills update" etc. → owner does it in git
  provider_credentials: "none — the runtime holds no keys; voices (Chatterbox, Kokoro) and renders run on your Modal runtime; no image generation"
  voice_policy:
    allowed_reference_voices: [owner]          # only voices with recorded consent
    per_show: {jai: "you record it", sherlock: "Kokoro bm_lewis (base, British)", striker: "you record it"}
    requires_consent_record: true              # shows/<show>/voice/reference/CONSENT.md
    forbidden: [real people or characters without consent (e.g. celebrity or cartoon voice actors)]
  # Given as a brief (purpose + table of contents) instead of the full text; the employee opens the part it needs
  # with skill_read. humanizer's rules are also machine-checked by no_ai_tells; hyperframes' routing job is
  # pre-decided by task_type; to-questionnaire is only needed when a lead actually has questions.
  on_demand: [humanizer, hyperframes, to-questionnaire]
  telemetry: off   # hyperframes / media-use analytics (PostHog) disabled — no task data leaves via telemetry

# Per-skill overrides: steps inside a skill that clash with our rules are disabled or rerouted.
adapters:
  hyperframes:        {missing_workflows: [motion-graphics, pr-to-video], strip: [hyperframes publish, skills update, "workflow routing (product-launch-video / faceless-explainer / music-to-video / general-video)"], note: "workflow is pre-selected by task_type; hyperframes only does project setup/state + capability routing", publish_via: "none - render to workspace only"}
  hyperframes-cli:    {strip: [publish, cloud, lambda, cloudrun, tts, auth], note: "render locally in the Modal sandbox only; voice comes from voice.synthesize", allow: [lint, check, preview, snapshot, render, tts, transcribe, remove-background]}
  jai:                {design_from: "Pixel's artifacts in your inputs + the show bible — skip the /ui-ux-pro-max step", script_from: "YOUR script (owner) in the request or uploads (show-jai) — skip the skill's research, brainstorming and script-writing steps", voiceover: "you record it — the builder asks for it as an asset (upload show-jai), never synthesizes or clones", project: "the task sandbox project replaces /Users/jaidhingra/JAI_INSTA; core/reel.py runs inside sandbox_exec", strip_steps: ["superpowers:brainstorming", "/hallmark", "/artsy-components", "SendUserFile", "Chatterbox voice"], strip: ["superpowers:brainstorming", publish, "/hallmark pass (deleted - humanizer does the text pass)", "/artsy-components effects (deleted)", "voice cloning"], replace_with: "handoff packet + open_questions to Lead", posting: "Post prepares it; you approve"}
  football-video:     {design_from: "Pixel's artifacts in your inputs + the show bible — skip the /ui-ux-pro-max step", script_from: "YOUR script (owner) in the request or uploads (show-striker) — skip the skill's research + script-writing steps", voiceover: "you record it — the builder asks for it as an asset, never synthesizes", strip: [publish, post it], output: "video + caption draft"}
  sherlock:           {design_from: "Pixel's artifacts in your inputs + the show bible — skip the /ui-ux-pro-max step", script_from: "the Sherlock-Writer script in your inputs — skip the skill's research + script-writing steps", voice: "voice.synthesize voice=base (Kokoro bm_lewis)", project: "the task sandbox project; core/reel.py runs inside sandbox_exec", strip: [publish, post it, "implicit trigger \"asks for a new AI reel\""], trigger: "only when owner explicitly says sherlock", scope: "AI topics only", output: "video + caption draft"}
  ui-ux-pro-max:      {show_work: "on a show task the show bible (DESIGN.md) / show skill locks palette, fonts and style — use ui-ux-pro-max ONLY for layouts or elements the bible does not cover, inside the locked palette and fonts"}
  slides:             {strip: ["own design tokens / palette choice"], note: "design system comes from ui-ux-pro-max (loaded first)"}
  hyperframes-creative: {strip: ["palette / typography / brand decisions"], note: "design system comes from ui-ux-pro-max (loaded first)"}
  general-video:      {note: "references motion-graphics (not installed) — short unnarrated motion pieces also go to general-video"}
  make-scenario-building: {missing_companion: "make-module-configuring (HOW to configure modules) not installed — whoever holds this skill designs scenario structure only; module config is a GAP"}
  media-use:          {voice: "voice_line tool (the show's voice) instead of ElevenLabs/HeyGen TTS", image_generation: "disabled until an image provider is chosen"}
  research:           {output: "task workspace (not repo files)"}
  handoff:            {output: "only the handoff packet's context_summary field (schemas/handoff_packet.json)"}
  triage:             {prerequisite: "setup-matt-pocock-skills run once by owner", tracker: "report in the task workspace (no GitHub issues)"}
  to-tickets:         {tracker: "pm.create_task (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  to-spec:            {tracker: "drive.create_draft (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  wayfinder:          {tracker: "pm.create_task (not GitHub issues)", prerequisite: "setup-matt-pocock-skills run once by owner"}
  to-questionnaire:   {output: "only the contract's `questions` field (the owner answers in the Slack thread)"}
  ui-styling:         {note: "implements the design system ui-ux-pro-max chose; never picks its own palette/type"}
  write-a-skill:      {output: "the new SKILL.md goes INSIDE the employee spec file (new_skills:), never into .claude/skills"}
  faceless-explainer: {note: "may suggest product-launch-video when input is a URL - Lead must re-route via task_type instead"}

# STATUS: all resolutions below DECIDED by owner (2026-09-29).
# Skills that overlap or fight. Never loaded in the same route unless `order` says how they stack.
conflicts:
  - group: [ui-ux-pro-max, media-use]
    order: [ui-ux-pro-max, media-use]
    why: 'media-use can pick looks/colour grades too'
    resolution: 'DECIDED: ui-ux-pro-max sets style; media-use only generates/resolves the asset'
  - group: [ui-ux-pro-max, slides]
    order: [ui-ux-pro-max, slides]   # ui-ux-pro-max sets the design system, slides builds the deck
    why: 'DECIDED: ui-ux-pro-max is the only design-system skill (hallmark deleted)'
    resolution: 'DECIDED: every visual = ui-ux-pro-max (design, design-system, banner-design, artsy-components, excalidraw-diagram, hallmark deleted)'
  - group: [ui-ux-pro-max, hyperframes-creative]
    order: [ui-ux-pro-max, hyperframes-creative]
    why: 'hyperframes-creative also sets palette/typography/brand'
    resolution: 'DECIDED: ui-ux-pro-max designs (design system, palette, type); hyperframes-creative only narration, beat planning, composition patterns; HyperFrames builds'
  - group: [hyperframes]
    why: 'DECIDED: all videos use HyperFrames (remotion-best-practices deleted)'
    resolution: 'DECIDED: every video = hyperframes (+ its sub-skills)'
  - group: [product-launch-video, faceless-explainer, music-to-video, general-video]
    why: 'alternative video workflows'
    resolution: 'DECIDED: keep all 4, exactly one per task, chosen by input — product URL/brief=product-launch-video, text with no footage=faceless-explainer, music track=music-to-video, anything else=general-video'
  - group: [football-video]
    why: 'DECIDED: popeye deleted'
    resolution: 'DECIDED: all football videos = football-video'
  - group: [jai, sherlock]
    why: 'both make topic reels'
    resolution: 'DECIDED: jai = general videos; sherlock = AI videos only, and only when you explicitly say sherlock. v2: each is its own employee, bound to its show'
  - group: [ui-ux-pro-max, ui-styling]
    order: [ui-ux-pro-max, ui-styling]
    why: 'ui-styling also carries styling opinions'
    resolution: 'ui-ux-pro-max sets the design system; ui-styling only implements it in code'
  - group: [web-quality-audit, seo, core-web-vitals]
    why: 'web-quality-audit already covers SEO, performance, a11y, best practices'
    resolution: 'DECIDED: full audit=web-quality-audit; SEO content/on-page only=seo; speed metrics only=core-web-vitals (accessibility, performance deleted)'
  - group: [humanizer]
    why: 'DECIDED: humanizer is the only text rewriter (brand and linkedin-marketing deleted)'
    resolution: 'DECIDED: every text rewrite = humanizer'
  - group: [to-tickets, agile-product-owner, wayfinder, to-spec]
    why: 'all break down/plan work'
    resolution: 'DECIDED (as mapped): decisions still open=wayfinder; agreed discussion → document=to-spec; known plan → tickets=to-tickets; sprints/story points/velocity only=agile-product-owner'
  - group: [writing-for-agents, teach]
    why: 'teach is interactive tutoring of you, not document writing'
    resolution: 'DECIDED (as mapped): writing-for-agents for SOPs; teach stays unassigned'
  - group: [handoff, to-questionnaire]
    why: 'both compress context for someone else'
    resolution: 'DECIDED (as mapped): to specialists=handoff (packet summary); to you, when blocked on a decision=to-questionnaire'

# Phase skills: loaded into a Lead's / router's own phases (they never run routes — they plan and delegate).
phase_skills:
  lead:   {contract: [to-questionnaire], plan: [handoff]}
  router: {contract: [to-questionnaire]}

# Route fields: task_type is unique ORG-WIDE (one owner per kind of work, I2). upstream_from = the plan must
# hand this specialist an output made by one of these employees (earlier packet, or another department's
# artifact) — a writer never researches, a producer never writes its own script.
employees:

  # ---------------- head office (run by the Dispatcher, not by routes)
  chief_of_staff: {routes: []}                  # Atlas — phase skill to-questionnaire
  verifier: {routes: []}                        # Vera — grades every delivery against your request
  fact_checker: {routes: []}                    # Proof — claim checking
  librarian: {routes: []}                       # Lex — code path
  office_architect:                             # Mason — writes a PROPOSAL, never live config
    routes:
      - {task_type: design_employee, output: "one YAML employee spec — FIRST output", run: [writing-for-agents, write-a-skill], checks: [employee_spec]}

  # ---------------- studio (3 channels; every route is bound to its show)
  studio_lead: {routes: []}                     # Maya
  studio_designer:                              # Pixel
    routes:
      - {task_type: sherlock_visual, shows: [sherlock], drop_sections: {ui-ux-pro-max: ["Step 4: Stack Guidelines", "Before Delivering App UI", "Output Formats"]}, output: "PNG — FIRST output", requires: render, run: [sherlock, ui-ux-pro-max], scope: "design-pass step of /sherlock only (its locked style)", checks: [image_spec, spellcheck]}
      - {task_type: jai_visual, shows: [jai], drop_sections: {ui-ux-pro-max: ["Step 4: Stack Guidelines", "Before Delivering App UI", "Output Formats"]}, output: "PNG — FIRST output", requires: render, run: [jai, ui-ux-pro-max], scope: "design-pass step of /jai only (its locked style)", checks: [image_spec, spellcheck]}
      - {task_type: football_visual, shows: [striker], drop_sections: {ui-ux-pro-max: ["Step 4: Stack Guidelines", "Before Delivering App UI", "Output Formats"]}, output: "PNG — FIRST output", requires: render, run: [football-video, ui-ux-pro-max], scope: "design step of /football-video only (Pitch + Volt)", checks: [image_spec, spellcheck]}
  studio_builder:                               # Frame — HyperFrames
    routes:
      - {task_type: sherlock_reel, shows: [sherlock], output: "the rendered MP4 — FIRST output; description.md second", requires: render, upstream_from: [show_sherlock_writer], run: [sherlock], scope: "asset list, voice, build, check, render, description steps of /sherlock (the script arrives approved)", checks: [hyperframes_check, video_spec]}
      - {task_type: jai_reel, shows: [jai], output: "the rendered MP4 — FIRST output; description.md second", requires: render, run: [jai], scope: "asset list (incl. your recorded voiceover), build, check, render, description steps of /jai — your script arrives in the request or uploads", checks: [hyperframes_check, video_spec]}
      - {task_type: football_reel, shows: [striker], output: "the rendered MP4 — FIRST output; description.md second", requires: render, run: [football-video], scope: "asset request (incl. your recorded voiceover), build, check, render steps of /football-video — your script arrives in the request or uploads", checks: [hyperframes_check, video_spec]}
    support: [hyperframes, hyperframes-core, hyperframes-creative, hyperframes-animation, hyperframes-keyframes, hyperframes-audio, hyperframes-registry, hyperframes-studio, hyperframes-cli, media-use]
  studio_poster:                                # Post
    routes:
      - {task_type: post_reel, output: "post package JSON (file, caption, cover, hashtags, time) — FIRST output", upstream_from: [studio_builder], run: [], checks: [json_valid]}

  # ---------------- sales
  sales_lead: {routes: []}                      # Sam
  sales_writer:                                 # Voice — writes like you (trained in context/sales_writer.md)
    routes:
      - {task_type: pitch_email, run: [humanizer], checks: [spellcheck, no_ai_tells, char_limits, citations_resolve]}
      - {task_type: dm,          run: [humanizer], checks: [spellcheck, no_ai_tells, char_limits, citations_resolve]}
      - {task_type: follow_up,   run: [humanizer], checks: [spellcheck, no_ai_tells, char_limits]}
      - {task_type: caption, shows: [jai, striker], run: [humanizer], checks: [no_ai_tells, char_limits]}
      - {task_type: post_copy,   run: [humanizer], checks: [spellcheck, no_ai_tells, char_limits]}
  sales_ideas:                                  # Spark — ideas the way you trained it
    routes:
      - {task_type: generate_ideas, run: [research], scope: "find and PICK ideas only — never write the script", checks: [citations_resolve, link_check]}
  show_sherlock_writer:                         # Sherlock-Writer (researches + writes)
    routes:
      - {task_type: sherlock_script, shows: [sherlock], run: [sherlock, humanizer], scope: "research + script + captions steps of /sherlock only", checks: [spellcheck, no_ai_tells, citations_resolve]}
  sales_applications:                           # Apply — holds your CV
    routes:
      - {task_type: cover_letter, pii_allowed: true, run: [humanizer], scope: "rewrite pass keeps the rawness — remove AI tells only, never polish the passion out", checks: [spellcheck, no_ai_tells, citations_resolve]}
      - {task_type: job_application, pii_allowed: true, run: [humanizer], checks: [spellcheck, no_ai_tells, citations_resolve]}
  sales_job_scout:                              # Scout
    routes:
      - {task_type: find_jobs, run: [research], checks: [citations_resolve, link_check]}

  # ---------------- engineering (one employee per project lane)
  eng_lead: {routes: []}                        # Forge
  eng_backend_company:                          # Byte-Co — company lane
    routes:
      - {task_type: company_implement,    requires: sandbox, run: [implement, tdd], checks: [sandbox_tests]}
      - {task_type: company_fix_bug,      requires: sandbox, run: [diagnosing-bugs, tdd], checks: [sandbox_tests]}
      - {task_type: company_write_spec,   run: [to-spec], checks: [spellcheck]}
      - {task_type: company_tickets, output: "tickets as JSON — FIRST output",      run: [to-tickets], checks: [json_valid]}
      - {task_type: power_automate_flow, output: "Power Automate / Logic Apps definition JSON ({\"definition\": {triggers, actions}}) — FIRST output",  run: [], scope: "Power Automate only", checks: [power_automate_only]}
    support: [strict-api, setup-pre-commit, git-guardrails-claude-code]
  eng_office_app:                               # Loom — this AI-office project
    routes:
      - {task_type: office_implement,  requires: sandbox, run: [implement, tdd], checks: [sandbox_tests]}
      - {task_type: office_fix_bug,    requires: sandbox, run: [diagnosing-bugs, tdd], checks: [sandbox_tests]}
      - {task_type: office_build_ui,   requires: sandbox, run: [ui-ux-pro-max, ui-styling, components, vercel-react-best-practices], checks: [sandbox_tests]}
      - {task_type: office_review,     run: [best-practices, strict-api], checks: [spellcheck]}
      - {task_type: office_deploy_preview, requires: sandbox, run: [deploy-to-vercel], checks: [sandbox_tests]}
    support: [strict-api, setup-pre-commit, git-guardrails-claude-code, vercel-composition-patterns]

  # ---------------- ops
  ops_lead: {routes: []}                        # Otto
  ops_inbox_scanner:                            # Scan (daily 9am routine)
    routes:
      - {task_type: inbox_digest, pii_allowed: true, run: [], checks: [inbox_coverage]}
  ops_bookkeeper:                               # Ledger
    routes:
      - {task_type: bookkeeping, run: [], checks: [citations_resolve]}
      - {task_type: invoice,     pii_allowed: true, run: [], checks: [spellcheck, citations_resolve]}
  ops_reporting_analyst:                        # Gauge
    routes:
      - {task_type: dashboard,     run: [], checks: [citations_resolve]}
      - {task_type: weekly_report, run: [], checks: [spellcheck, citations_resolve]}

# agent-harness is NOT an employee skill: it's the Dispatcher's task loop engine (config/harness.yaml).
system_engine: [agent-harness]

unassigned:
  builder_only:            # the owner runs this once so to-spec / to-tickets / wayfinder / triage know your tracker
    - setup-matt-pocock-skills
  library:                 # installed but held by no employee: Mason maps these onto new hires (e.g. a new project engineer)
