# Check library — the ONLY commands the harness may run as verification.
# Implemented in workforce/checks.py. Exit 0 pass, 1 fail, 3 unavailable (counts as fail).
# Placeholders filled by workforce/harness.py: {T}=plan-task dir, {W}=task workspace, {platform}, {url}.
# {T}/primary = the specialist's primary output artifact (first of return.outputs).
# kind: executable (controller runs it) | manual-evidence (Verifier verdict or owner G4 only).

version: 0.1

checks:
  deliverable_only:   {kind: executable, cmd: "python3 -m workforce.checks deliverable_only {T}/primary", what: "the deliverable holds only the deliverable (no draft labels, gaps, notes, metadata)"}
  packet_schema:      {kind: executable, cmd: "python3 -m workforce.checks packet_schema {T}/return.json", what: return packet matches schemas/return_packet.json}
  criteria_covered:   {kind: executable, cmd: "python3 -m workforce.checks criteria_covered {T}/handoff.json {T}/return.json", what: every assigned criterion has a self_check entry with evidence}
  citations_resolve:  {kind: executable, cmd: "python3 -m workforce.checks citations_resolve {T}/return.json {W}/sources.json {W}/artifacts", what: "every citation was actually observed in this task (fetched URL, memory id read, connector pointer returned, existing artifact)"}
  spellcheck:         {kind: executable, cmd: "python3 -m workforce.checks spellcheck {T}/primary", what: no spelling errors (custom dictionary in L0)}
  no_ai_tells:        {kind: executable, cmd: "python3 -m workforce.checks no_ai_tells {T}/primary", what: regex lint of the humanizer pattern list (not-X-but-Y, stock AI words, em-dash density...)}
  char_limits:        {kind: executable, cmd: "python3 -m workforce.checks char_limits {T}/primary {platform}", what: platform/format length limits}
  pii_absent:         {kind: executable, cmd: "python3 -m workforce.checks pii_absent {T}/artifacts", what: no personal data where not allowed}
  link_check:         {kind: executable, cmd: "python3 -m workforce.checks link_check {T}/primary {W}/sources.json", what: "links resolve (URLs fetched in this task count as verified)"}
  image_spec:         {kind: executable, cmd: "python3 -m workforce.checks image_spec {T}/primary {T}/spec.json", what: dimensions, format, file size per contract}
  video_spec:         {kind: executable, cmd: "python3 -m workforce.checks video_spec {T}/primary {T}/spec.json", what: duration, aspect, fps, audio track present}
  hyperframes_check:  {kind: executable, cmd: "npx hyperframes check {T}/project", what: composition passes HyperFrames lint/check}
  json_valid:         {kind: executable, cmd: "python3 -m workforce.checks json_valid {T}/primary", what: Make blueprint / tickets / structured output is valid}
  brand_colors:       {kind: executable, cmd: "python3 -m workforce.checks brand_colors {T}/primary", what: palette within brand kit, requires: brand_kit}
  web_audit_scores:   {kind: executable, cmd: "python3 -m workforce.checks web_audit_scores {url}", what: Lighthouse thresholds (perf/a11y/SEO/best-practices)}
  sandbox_tests:      {kind: executable, cmd: "python3 -m workforce.checks sandbox_tests {T}", what: "the engineer's tests pass inside the isolated code sandbox (never on the Dispatcher host)"}
  employee_spec:      {kind: executable, cmd: "python3 -m workforce.checks employee_spec {T}/primary", what: "Architect proposal is a complete, safe employee spec (no R3/R4, unique id + task types, 3 probation tasks)"}
  verifier_verdict:   {kind: manual-evidence, what: "LLM Verifier graded every criterion PASS/UNVERIFIABLE", added_by: "Dispatcher per DESIGN-MAP section 7 risk table - never listed in routes"}
  # Owner review is NOT a harness check: G4 always happens after the loop closes (a check would deadlock the loop).

always: [packet_schema, criteria_covered, pii_absent, deliverable_only]   # added to every route automatically
# pii_absent is dropped only on routes marked `pii_allowed: true` (your own CV / an invoice must hold contact details)
