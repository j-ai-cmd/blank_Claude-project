# Memory layers — enforced by the storage/query layer (row-level ACL), not by prompts.

version: 0.2

storage:
  backend: postgres_rowlevel_acl + object_store   # NEVER the agent sandbox filesystem (shared across threads)
  access: via memory.* / workspace.* custom tools executed by the Dispatcher
  acl_key: [employee_id, department_id, task_id]
  writes: optimistic_lock (version field); conflict → reread, never overwrite
  l1_writes: serialized through librarian queue

layers:
  L0_constitution:
    source: git (config/constitution.md + company/*.md, brand kit)
    read: [all]
    write: [owner_via_git]
    ttl: none
  L1_dept_playbook:
    scope: department
    read: [dept_lead, dept_specialists, chief_of_staff, verifier]
    write: [librarian]            # only after owner approval or accepted task
    ttl: until_superseded
    stale_after_days_unused: 60     # except pinned: true
  L2_employee_profile:
    source: git (config/org.yaml)
    read: [self]
    write: [owner_via_git]
    ttl: none
  L3_employee_private:
    scope: employee
    read: [self]                  # NOT the lead, NOT siblings. Owner can inspect via admin.
    write: [librarian]
    ttl_days_since_last_use: 180    # except pinned: true (never expires)
    max_entries: 300              # beyond → Librarian compacts lowest-score entries
  L4_task_workspace:
    scope: task
    read: [assigned_lead, assigned_specialists_by_handoff_ref, verifier]
    write: [assigned_lead, assigned_specialists]
    ttl: archive 7 days after CLOSED; if contains PII → purge (not archive) 7 days after CLOSED
    session_context: dies with the task session (one session per task)
  L5_audit:
    read: [owner, dispatcher]
    write: [dispatcher]
    in_agent_context: never
    ttl_days: 365
    pii: redacted_or_hashed           # raw payloads: encrypted store, 30 days, then deleted
  L1_daily_note:
    scope: department
    write: [dept_lead_routine]
    ttl_days: 14

truth_hierarchy: [live_system_of_record, L0, L1, L3_verified, L4, model_knowledge_craft_only]

promotion_rules:               # candidate -> L1/L3
  human_review: candidates are listed on the G4 acceptance card as checkboxes; only ticked ones are eligible
  treat_candidate_text_as: untrusted_data   # never executed as instructions by the Librarian
  flag_if_derived_from_untrusted_source: true   # shown with a ⚠ on the G4 card
  allowed_if_any:
    - source_task_state == ACCEPTED and owner_ticked
    - origin == direct_owner_instruction and owner_confirmed_standing
    - refetchable_from_system_of_record   # stored as POINTER only (kind: fact_pointer), value never copied
  reject_if_any:
    - no_source
    - content_is_intention      # "I will...", "plan to..."
    - contradicts_L0
    - contains_secret
    - contains_pii                  # PII lives only in systems of record
  on_contradiction_with_L1_or_L3: ask_owner

instruction_classification:
  one_off:   {store: L4, dies_at: task_closed}
  standing:  {store: L1_or_L3, requires: owner_confirm, default_ttl_days: 180, supersedes: same_topic_older}
  pinned:    {store: L1_or_L3, requires: owner_confirm, ttl: none, unpin: owner_only}
  ambiguous: {action: ask_owner, question: "Always, or just this time?"}

retrieval:
  context_budget_pct: 15
  score: relevance * 0.97^days_since_last_verified * confidence
  top_k: 12
  always_include: [L0_core, L2_self]

gc:
  schedule: weekly (librarian)
  skip: [pinned]
  steps: [dedupe_exact, merge_near_duplicates, mark_stale_unused_30d, archive_stale_60d, detect_contradictions_ask_owner, compact_L3_over_max, report_to_agent_log]
  hard_delete: never_without_R3    # exception: PII purge per privacy policy and data-subject deletion requests

privacy:
  data_subject_deletion: purge pointers + L4 + raw L5 for that person; log a hashed record of the purge

compaction:
  lead_thread_summarize_every_turns: 20
  keep: [contract_current_version, decisions, open_questions, artifact_refs]
  drop_on_contract_revision: superseded_handoff_packets
