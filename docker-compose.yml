# One machine (Oracle Cloud Always Free, see docs/DEPLOY-GUIDE.md):
#   api (Dispatcher) -> db (Postgres) ; api -> runtime (videos, voices, code tests)
#   production adds Caddy for HTTPS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workforce}
      POSTGRES_DB: workforce
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U workforce"], interval: 5s, retries: 10}
    mem_limit: 3g                      # 24 GB box: db 3 + api 4 + runtime 14 = 21, the rest stays free for the OS
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://workforce:${POSTGRES_PASSWORD:-workforce}@db:5432/workforce
      WORKSPACE_ROOT: /app/var/workspace
      RUNTIME_BACKEND: ${RUNTIME_BACKEND:-remote}
      RUNTIME_URL: ${RUNTIME_URL:-http://runtime:8080}
    ports: ["8000:8000"]           # docker-compose.prod.yml removes this and puts Caddy (HTTPS) in front
    volumes:
      - workspace:/app/var/workspace
      # your files and hires live in the cloned repo on the server, so they survive rebuilds
      - ./uploads:/app/uploads
      - ./outbox:/app/outbox
      - ./proposals:/app/proposals
      - ./config:/app/config
      - ./context:/app/context
      - ./.claude/skills:/app/.claude/skills
    depends_on: {db: {condition: service_healthy}}
    mem_limit: 4g                      # a runaway render or voice model can't take the API (and Slack) down with it
    restart: unless-stopped
  runtime:
    # Runs what employees build. Gets ONLY its token: no .env, no repo, no published port, no Linux capabilities.
    build: {context: ., dockerfile: deploy/runtime.Dockerfile}
    environment:
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:?set RUNTIME_TOKEN in .env}
    volumes: [models:/models]          # downloaded voice models survive restarts
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 14g
    cpus: 3
    restart: unless-stopped
volumes:
  pgdata:
  workspace:
  models:
